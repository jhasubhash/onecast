name: Onecast
options:
  bundleIdPrefix: com.onecast
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  # Both configs read the signing identity from Signing.xcconfig: the self-signed default, overridden
  # by the gitignored Signing.local.xcconfig when present. A clone without it (CI) signs self-signed,
  # so official releases stay self-signed; a machine with the override signs its local Release too.
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Manual
    SWIFT_STRICT_CONCURRENCY: complete
  configs:
    Release:
      # Signing identity + team now come from Signing.xcconfig (see configFiles), not pinned here.
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Onecast:
    type: application
    platform: macOS
    sources:
      - path: Onecast
        # The helper's own sources: compiling them in would link Vision and PDFKit into the app,
        # which is the whole thing running recognition out of process avoids.
        excludes:
          - Features/Clipboard/Service/ClipboardTextExtractor.swift
          - Features/Clipboard/Service/ClipboardTextHelper.swift
      # The MIT mark's licence asks the notice to travel with the binary, not just the repo.
      - path: NOTICE.md
        buildPhase: resources
    dependencies:
      - target: ClipboardTextHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - target: OnecastPluginKit
        link: true
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onecast.app
        INFOPLIST_FILE: Onecast/Info.plist
        CODE_SIGN_ENTITLEMENTS: Onecast/Onecast.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: onecast
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
      configs:
        # Debug is its own channel, like beta/stable in release.yml: a distinct bundle id means a
        # locally-run build gets its own prefs, caches, TCC grants and login item instead of
        # inheriting — and corrupting — the installed app's state.
        Debug:
          PRODUCT_NAME: Onecast Dev
          PRODUCT_BUNDLE_IDENTIFIER: com.onecast.app.dev
    # Xcode strips OnecastPluginKit's Swift module when it embeds the framework, leaving the shipped
    # copy with no `.swiftinterface` — so the app couldn't compile a plugin against its own framework.
    # Restore just the stable textual interface (the binary swiftmodule is compiler-version-specific
    # and would shadow it), wire the top-level `Modules` symlink, and re-sign so the seal stays valid.
    postBuildScripts:
      - name: Restore OnecastPluginKit interface
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          fw="${CODESIGNING_FOLDER_PATH}/Contents/Frameworks/OnecastPluginKit.framework"
          src="${BUILT_PRODUCTS_DIR}/OnecastPluginKit.framework/Versions/A/Modules"
          [ -d "$src" ] && [ -d "$fw" ] || exit 0
          dst="$fw/Versions/A/Modules"
          rm -rf "$dst"; mkdir -p "$dst"
          cp -R "$src/" "$dst/"
          find "$dst" -type f ! -name '*.swiftinterface' ! -name '*.swiftdoc' -delete
          ln -sfh "Versions/Current/Modules" "$fw/Modules"
          id="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          if [ "${ENABLE_HARDENED_RUNTIME:-NO}" = "YES" ]; then
            codesign --force --sign "$id" --options runtime "$fw"
          else
            codesign --force --sign "$id" "$fw"
          fi

  ClipboardTextHelper:
    type: tool
    platform: macOS
    sources:
      - Onecast/Features/Clipboard/Service/ClipboardTextExtractor.swift
      - Onecast/Features/Clipboard/Service/ClipboardTextHelper.swift
    settings:
      base:
        # release.yml passes PRODUCT_NAME on the xcodebuild line, which hits every target: without
        # these two pinned, a channel build renames the executable `ClipboardTextWorker` looks for
        # and gives the module a name with a space in it.
        EXECUTABLE_NAME: ClipboardTextHelper
        PRODUCT_MODULE_NAME: ClipboardTextHelper
        SKIP_INSTALL: YES

  # The public plugin contract. Embedded in the app so a loaded plugin dylib resolves the exact
  # same module identity it was compiled against; a plugin links this framework, never a copy.
  OnecastPluginKit:
    type: framework
    platform: macOS
    sources:
      - path: OnecastPluginKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.onecast.pluginkit
        PRODUCT_NAME: OnecastPluginKit
        PRODUCT_MODULE_NAME: OnecastPluginKit
        DEFINES_MODULE: YES
        # A stable .swiftinterface so a plugin built by a different Xcode still imports it.
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_STYLE: Manual
